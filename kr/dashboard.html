const FILTERS=[['all','전체'],['brk','🚀 신고가돌파'],['sig','오늘 시그널'],['cand','구조 후보'],['rs90','RS 90+']];
function goScreener(f){scFilter=f||'all';const btns=[...document.querySelectorAll('.tab')];
  const t=btns.find(b=>b.textContent.includes('스크리너'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(t)t.classList.add('on');renderScreener();}
function matchFilter(r){
  if(scFilter==='all')return true;
  if(scFilter==='brk')return !!r.broke_52w_high;
  if(scFilter==='rs90')return (r.rs_rating||0)>=90;
  const g=r.gates||{};const keys=Object.keys(g);
  if(scFilter==='sig')return keys.length&&keys.every(k=>g[k]);
  if(scFilter==='cand')return keys.length&&keys.filter(k=>k!=='G3').every(k=>g[k]);
  return true;
}
function renderScreener(){
  const cols=[['name','종목'],['price','현재가'],['rs_rating','RS'],['stage','단계'],['total','종합'],['ad_score','A/D'],['pattern','패턴'],['dist_to_pivot_pct','피벗까지%'],['avg_value_20d','거래대금']];
  const chips=FILTERS.map(f=>`<button class="btn" style="padding:3px 10px;${scFilter===f[0]?'background:#185FA5;color:#fff;border-color:#185FA5':''}" onclick="scFilter='${f[0]}';fillScreener();syncChips()">${f[1]}</button>`).join(' ');
  let h=`<div class="panel"><div class="p-t">📋 스크리너 <span class=muted>· 헤더 클릭 정렬</span></div>
    <div id="chips" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">${chips}</div>
    <div style="overflow-x:auto"><table><thead><tr>`;
  cols.forEach(c=>{const isnum=!['name','pattern'].includes(c[0]);h+=`<th class="${isnum?'num':''}" onclick="sortSc('${c[0]}')">${c[1]}</th>`;});
  h+=`</tr></thead><tbody id="scbody"></tbody></table></div></div>`;
  document.getElementById('main').innerHTML=h;fillScreener();
}
function syncChips(){const c=document.getElementById('chips');if(!c)return;
  [...c.children].forEach((b,i)=>{const on=FILTERS[i][0]===scFilter;b.style.background=on?'#185FA5':'#fff';b.style.color=on?'#fff':'#1a1a18';b.style.borderColor=on?'#185FA5':'#d3d1c7';});}
function fillScreener(){
  const q=(document.getElementById('q').value||'').toUpperCase().trim();
  let rows=(S.screener||[]).filter(r=>matchFilter(r)&&(!q||(r.name||'').toUpperCase().includes(q)||r.ticker.includes(q)));
  rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(x==null)x=-1e18;if(y==null)y=-1e18;if(typeof x==='string')return sortDir*x.localeCompare(y);return sortDir*(x-y);});
  document.getElementById('scbody').innerHTML=rows.map(r=>`<tr>
    <td><span class=sym>${r.name||r.ticker}</span> <span class=co>${r.ticker}</span></td>
    <td class=num>${won(r.price)}</td><td>${rsCell(r.rs_rating)}</td><td>${stg(r.stage)}</td>
    <td class=num>${r.total??''}</td><td class=num>${r.ad_score??''}</td><td>${patB(r.pattern)}${r.broke_52w_high?' <span class=brk>🚀</span>':''}</td>
    <td class=num>${r.dist_to_pivot_pct!=null?r.dist_to_pivot_pct.toFixed(1)+'%':''}</td>
    <td class=num>${r.avg_value_20d!=null?Math.round(r.avg_value_20d/1e8)+'억':''}</td></tr>`).join('')
    ||'<tr><td colspan=9 class=muted style="padding:16px">검색 결과가 없습니다.</td></tr>';
}
function sortSc(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}fillScreener();}
function filterScreener(){if(document.getElementById('scbody'))fillScreener();}
function renderSector(){
  const ti=S.top_industries||[];const mx=Math.max(...ti.map(t=>t.strength_pct),1);
  let h=`<div class="panel"><div class="p-t">🏭 강한 업종 순위 <span class=muted>· 업종별 소속종목 RS 강도 백분위</span></div>`;
  ti.forEach(t=>{h+=`<div class="ind"><span class="nm">${t.industry}</span><span class="ib"><span class="if" style="width:${(t.strength_pct/mx*100).toFixed(0)}%"></span></span><span class="muted" style="width:28px;text-align:right">${t.strength_pct.toFixed(0)}</span></div>`;});
  h+=`</div>`;document.getElementById('main').innerHTML=h;
}
function eqSvg(hist){if(!hist||!hist.length)return '<div class=muted style="padding:14px">데이터 축적 중</div>';
  let pts=hist.map(h=>h.equity);if(pts.length==1)pts=[pts[0],pts[0]];
  const lo=Math.min(...pts),hi=Math.max(...pts),rng=(hi-lo)||1,W=640,H=120;
  const xs=pts.map((_,i)=>8+(W-16)*i/(pts.length-1)),ys=pts.map(v=>10+(H-20)*(1-(v-lo)/rng));
  const line=xs.map((x,i)=>x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');const c=pts[pts.length-1]>=pts[0]?'#C0392B':'#1565C0';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px" preserveAspectRatio=none><polyline points="${line}" fill=none stroke="${c}" stroke-width=2/></svg>`;}
function renderStrategy(){
  const rc=P.ret>=0?'pos':'neg';
  let h=`<div class="cards5" style="grid-template-columns:repeat(4,1fr)">
    <div class="mc"><div class="n ${rc}">${won(P.equity)}</div><div class="l">총 자산</div></div>
    <div class="mc"><div class="n ${rc}">${P.ret>=0?'+':''}${P.ret}%</div><div class="l">수익률</div></div>
    <div class="mc"><div class="n">${P.positions.length}</div><div class="l">보유종목</div></div>
    <div class="mc"><div class="n">${P.pending.length}</div><div class="l">대기주문</div></div></div>
    <div class="panel"><div class="p-t">📈 수익 추이</div>${eqSvg(P.equity_history)}</div>
    <div class="panel"><div class="p-t">💼 보유 종목</div><table><thead><tr><th>종목</th><th>진입일</th><th class=num>진입가</th><th class=num>현재가</th><th class=num>수익률</th><th class=num>손익</th><th class=num>스톱</th></tr></thead><tbody>`;
  h+=P.positions.map(p=>`<tr><td><span class=sym>${p.name}</span> <span class=co>${p.symbol}</span></td><td class=muted>${p.entry_date}</td>
    <td class=num>${p.entry.toLocaleString()}</td><td class=num>${p.cur.toLocaleString()}</td><td class=num>${pn(p.gain)}%</td><td class=num>${pn(p.pnl)}</td><td class="num muted">${p.stop.toLocaleString()}</td></tr>`).join('')
    ||'<tr><td colspan=7 class=muted style="padding:14px">보유 종목 없음</td></tr>';
  h+=`</tbody></table></div>`;
  if(P.pending.length){h+=`<div class="panel"><div class="p-t">📋 진입 예정(대기)</div><table><thead><tr><th>종목</th><th class=num>수량</th><th class=num>지정가</th></tr></thead><tbody>`+
    P.pending.map(o=>`<tr><td><span class=sym>${o.name}</span> <span class=co>${o.symbol}</span></td><td class=num>${o.qty}</td><td class=num>${o.price.toLocaleString()}</td></tr>`).join('')+`</tbody></table></div>`;}
  document.getElementById('main').innerHTML=h;
}
function renderEntries(){
  const ks=(S.stats||{}).key_signals||{};
  const ins=(OR&&OR.instructions)||[];
  const budget=OR&&OR.per_position_budget;
  let h=`<div class="panel"><div class="p-t">🎯 진입 예정 종목 <span class=muted style="font-weight:400">· ${OR&&OR.snap_date||''} 스캔 기준</span></div>
    <div class="p-sub">시그널 퍼널: 관찰풀 ${S.watch_count||0} → 신고가돌파 ${ks.broke_52w||0} → 시그널 <b>${S.signal_count||0}</b>${budget?' · 종목당 '+Number(budget).toLocaleString()+'원 (원금 10%)':''}</div>`;
  if(ins.length){
    h+=`<table><thead><tr><th>종목</th><th class=num>수량</th><th class=num>지정가(+2%)</th><th class=num>스캔종가</th><th class=num>예상금액</th><th>RS</th></tr></thead><tbody>`;
    h+=ins.map(o=>`<tr><td><span class=sym>${o.name||o.symbol}</span> <span class=co>${o.symbol}</span></td><td class=num>${o.quantity}주</td>

    h+=`</tbody></table>
      <div class="muted" style="font-size:11px;margin-top:10px">다음 거래일 지정가 체결 가정으로 가상 편입 — 모두 dry-run(모의).</div></div>`;
  } else {
    h+=`<div class="muted" style="padding:14px 0">오늘 진입 예정 종목이 없어요.<br>
      <span style="font-size:12px">시그널 0건이거나(조정 국면), 이미 보유 중이거나, 원금 부족일 때 비어요.</span></div></div>`;
  }
  if(P.positions.length){
    h+=`<div class="panel"><div class="p-t">💼 이미 보유 중 <span class=muted style="font-weight:400">· 중복 매수 안 함</span></div>
      <table><thead><tr><th>종목</th><th>진입일</th><th class=num>수익률</th></tr></thead><tbody>`+
      P.positions.map(p=>`<tr><td><span class=sym>${p.name}</span> <span class=co>${p.symbol}</span></td><td class=muted>${p.entry_date}</td><td class=num>${pn(p.gain)}%</td></tr>`).join('')+
      `</tbody></table></div>`;
  }
  document.getElementById('main').innerHTML=h;
}
function renderCompare(){
  if(!CH||!CH.length){document.getElementById('main').innerHTML='<div class="panel muted" style="padding:20px">아직 스탁이지 비교 기록이 없어요. 스탁이지 종목을 알려주시면 대조가 쌓입니다.</div>';return;}
  const agr=CH.filter(h=>h.agree).length,rate=Math.round(agr/CH.length*100),last=CH[CH.length-1];
  const cc=rate>=50?'#3B6D11':'#A32D2D';
  let h=`<div class="panel"><div class="p-t">🆚 스탁이지 vs 우리 (${last.snap_date})</div>
    <div style="font-size:30px;font-weight:800;color:${cc}">일치율 ${rate}% <span class=muted style="font-size:13px;font-weight:400">· ${agr}/${CH.length}일</span></div>
    <table style="margin-top:10px"><tr><th>우리 진입</th><td>${(last.our_buy||[]).join(', ')||'없음'}</td></tr>
    <tr><th>스탁이지 진입</th><td>${(last.stockeasy_buy||[]).join(', ')||'없음'}</td></tr>
    <tr><th>공통</th><td>${(last.common||[]).join(', ')||'-'}</td></tr></table></div>
    <div class="panel"><div class="p-t">📅 대조 히스토리</div><table><thead><tr><th>날짜</th><th>우리</th><th>스탁이지</th><th>일치</th></tr></thead><tbody>`;
  h+=CH.slice().reverse().map(r=>`<tr><td>${r.snap_date}</td><td>${(r.our_buy||[]).join(',')||'-'}</td><td>${(r.stockeasy_buy||[]).join(',')||'-'}</td><td>${r.agree?'<span class=pos>✓</span>':'<span class=neg>✗</span>'}</td></tr>`).join('');
  h+=`</tbody></table></div>`;
  document.getElementById('main').innerHTML=h;
}
function renderGuide(){document.getElementById('main').innerHTML=`<div class="panel" style="text-align:center;padding:30px">
  <div style="font-size:15px;font-weight:600;margin-bottom:8px">📖 전략 가이드</div>
  <div class="muted" style="margin-bottom:16px">6-Gate·청산 사다리·용어를 정리한 상세 문서</div>
  <a class="btn" href="guide.html" style="display:inline-block">전략 가이드 열기 →</a></div>`;}
function miniSpark(spark,color){
  if(!spark||spark.length<2)return '';
  const lo=Math.min(...spark),hi=Math.max(...spark),rng=(hi-lo)||1,W=46,H=16;
  const pts=spark.map((v,i)=>`${(W*i/(spark.length-1)).toFixed(1)},${(H-1-(H-2)*(v-lo)/rng).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.3"/></svg>`;}
function renderTicker(){
  if(!IDX||!IDX.items){document.getElementById('ticker').style.display='none';return;}
  document.getElementById('ticker').innerHTML=IDX.items.map(it=>{
    const up=it.change_pct>=0, c=up?'#C0392B':'#1565C0';
    const v=it.value>=100?it.value.toLocaleString(undefined,{maximumFractionDigits:2}):it.value.toFixed(2);
    return `<span class="tk" style="cursor:pointer" onclick="openChart('${it.name}')" title="클릭 → 일봉 차트"><span class="tn">${it.name}</span>${miniSpark(it.spark,c)}<span class="tv">${v}</span><span class="tc" style="color:${c}">${up?'▲':'▼'}${Math.abs(it.change_pct).toFixed(2)}%</span></span>`;
  }).join('');
}
function findIdx(name){return (IDX&&IDX.items||[]).find(x=>x.name===name);}
function candleSVG(ohlc){
  const W=640,H=320,pt=26,pb=22,pl=6,prr=52,N=ohlc.length;
  const lo=Math.min(...ohlc.map(r=>r[3])),hi=Math.max(...ohlc.map(r=>r[2])),rng=(hi-lo)||1;
  const cw=(W-pl-prr)/N, y=v=>pt+(H-pt-pb)*(1-(v-lo)/rng);
  let s='';
  for(let k=0;k<=4;k++){const pv=lo+rng*k/4, yy=y(pv);
    s+=`<line x1="${pl}" y1="${yy}" x2="${W-prr}" y2="${yy}" stroke="#eee" stroke-width="1"/>`;
    s+=`<text x="${W-prr+4}" y="${yy+3}" font-size="10" fill="#999">${pv.toLocaleString(undefined,{maximumFractionDigits:2})}</text>`;}
  ohlc.forEach((r,i)=>{const o=r[1],h=r[2],l=r[3],c=r[4];const x=pl+cw*i+cw/2;
    const up=c>=o, col=up?'#C0392B':'#1565C0';
    s+=`<line x1="${x}" y1="${y(h)}" x2="${x}" y2="${y(l)}" stroke="${col}" stroke-width="1"/>`;
    const bw=Math.max(cw*0.62,1.4), yt=y(Math.max(o,c)), yb=y(Math.min(o,c));
    s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(yb-yt,1).toFixed(1)}" fill="${col}"/>`;});
  s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#999">${ohlc[0][0]}</text><text x="${W-prr}" y="${H-6}" text-anchor="end" font-size="10" fill="#999">${ohlc[ohlc.length-1][0]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${s}</svg>`;
}
function openChart(name){
  const it=findIdx(name); if(!it||!it.ohlc){return;}
  const up=it.change_pct>=0,c=up?'#C0392B':'#1565C0';
  const v=it.value>=100?it.value.toLocaleString(undefined,{maximumFractionDigits:2}):it.value.toFixed(2);
  document.getElementById('modal-body').innerHTML=
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
       <b style="font-size:17px">${it.name}</b><span style="font-size:17px;font-weight:700">${v}</span>
       <span style="color:${c};font-weight:600">${up?'▲':'▼'}${Math.abs(it.change_pct).toFixed(2)}%</span>
       <span class="muted" style="font-size:11px">일봉 · 최근 ${it.ohlc.length}거래일 · 상승 <span style="color:#C0392B">빨강</span>/하락 <span style="color:#1565C0">파랑</span></span></div>`+candleSVG(it.ohlc);
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
renderTicker();renderSide();renderTabs();renderPulse();
